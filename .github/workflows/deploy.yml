name: Deploy Ume Docs

# Builds the ume design-system docs site and deploys it to Cloudflare Pages.
# Triggers on every push to main (and manual dispatch). Needs two GitHub secrets:
# CLOUDFLARE_API_TOKEN (Pages deploy) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Build ume library
        run: npm run build

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs site
        working-directory: docs
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: docs
        run: npx wrangler pages deploy dist --project-name=ume --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
